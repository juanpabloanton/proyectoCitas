<VirtualHost *:91>
    DocumentRoot /var/www/back-laravel-citas/public/
    <Directory /var/www/back-laravel-citas/public/>
            Options Indexes FollowSymLinks MultiViews
            AllowOverride All
            Order allow,deny
            allow from all
            Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

